<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc mừng 20/10</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Background Canvas hiệu ứng sao/đom đóm */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Container chính */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }

    /* Dòng chữ tiêu đề với hiệu ứng gõ chữ và nhấp nháy phát sáng */
    .title {
      font-size: 2rem;
      margin-bottom: 30px;
      color: #ffb6c1;
      text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4;
      min-height: 2.5rem;
      letter-spacing: 1.5px;
    }

    /* Khung chứa các nút chuyển động phát sáng */
    .card-group {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }

    /* Nút phát sáng Neon Glow */
    .glow-card {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #00f3ff;
      border-radius: 16px;
      box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
      animation: pulse 2s infinite alternate;
    }

    .glow-card:nth-child(2) {
      border-color: #ff007f;
      box-shadow: 0 0 15px #ff007f, inset 0 0 15px #ff007f;
      animation-delay: 1s;
    }

    .glow-card:hover {
      transform: scale(1.15) translateY(-5px);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* Modal hiển thị lời chúc khi bấm nút */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(20, 15, 35, 0.9);
      border: 1px solid #ff69b4;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
      padding: 30px;
      border-radius: 20px;
      z-index: 10;
      text-align: center;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(10px);
      width: 80%;
      max-width: 400px;
    }

    .modal.active {
      transform: translate(-50%, -50%) scale(1);
    }

    .modal h2 {
      color: #ff69b4;
      margin-bottom: 15px;
    }

    .modal p {
      line-height: 1.6;
      font-size: 1.1rem;
      color: #eaeaea;
    }

    .close-btn {
      margin-top: 20px;
      padding: 8px 20px;
      background: #ff69b4;
      border: none;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 0 10px #ff69b4;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="container">
    <div class="title" id="typewriter"></div>

    <div class="card-group">
      <div class="glow-card" onclick="openModal('ChungTôiThươngBạn', 'Chúc bạn ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp và tràn đầy may mắn trong cuộc sống! ✨🌸')">🌸</div>
      <div class="glow-card" onclick="openModal('GửiNgườiTuyệtVời', 'Cảm ơn vì đã luôn mang lại năng lượng tích cực. Chúc bạn 20/10 rạng rỡ và đạt được mọi ước mơ! 💖🌟')">💌</div>
    </div>
  </div>

  <div class="modal" id="messageModal">
    <h2 id="modalTitle">Lời chúc 20/10</h2>
    <p id="modalBody">Nội dung lời chúc...</p>
    <button class="close-btn" onclick="closeModal()">Đóng</button>
  </div>

  <script>
    // 1. Hiệu ứng gõ chữ (Typewriter Effect)
    const text = "À thì cũng sắp 20/10 rồi...";
    let index = 0;
    const speed = 100;

    function typeWriter() {
      if (index < text.length) {
        document.getElementById("typewriter").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeWriter, speed);
      }
    }
    window.onload = () => {
      typeWriter();
      initCanvas();
    };

    // 2. Modal Lời Chúc
    function openModal(title, body) {
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("modalBody").innerText = body;
      document.getElementById("messageModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("messageModal").classList.remove("active");
    }

    // 3. Hiệu ứng Canvas Hạt/Sao lấp lánh và Hoa rơi
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const numParticles = 80;

    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      particles = [];
      for (let i = 0; i < numParticles; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 3 + 1,
          color: `hsl(${Math.random() * 60 + 300}, 100%, 75%)`,
          speedX: Math.random() * 1 - 0.5,
          speedY: Math.random() * 1 + 0.5,
          opacity: Math.random()
        });
      }
      animate();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p) => {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.y > canvas.height) p.y = 0;
        if (p.x > canvas.width) p.x = 0;
        if (p.x < 0) p.x = canvas.width;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.opacity;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
